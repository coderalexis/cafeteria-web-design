name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm exec tsc --noEmit

      - name: Lint
        run: pnpm lint

      - name: "Pruebas unitarias (lo puro: ajustes, fechas, carrito, cuentas)"
        run: pnpm test

      - name: Build
        run: pnpm build
        env:
          # Claves públicas dummy: el build solo necesita que existan;
          # las reales viven en Vercel.
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
          SUPABASE_SERVICE_ROLE_KEY: placeholder-service-key

  # La lógica de dinero vive en la base (create_ticket, cortes, promociones,
  # utilidad). Se prueba contra un Postgres real recién nacido: se le pone el
  # shim de Supabase, se le aplican las 36 migraciones tal cual están en el
  # repo y se corren los ensayos. Nada de mocks: si una migración deja de
  # aplicar desde cero o una regla de dinero cambia, esto se pone rojo.
  sql:
    name: Pruebas SQL (migraciones + reglas de dinero)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: pruebas
          POSTGRES_DB: pruebas
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Correr la suite
        run: bash tests/sql/run.sh
        env:
          DATABASE_URL: postgres://postgres:pruebas@localhost:5432/pruebas

      # Los tipos de TypeScript se generan contra ESTA base —la que acaba de
      # nacer de las migraciones— y se comparan con el archivo del repo. Así
      # el archivo deja de parcharse a mano: si una migración cambia el
      # esquema y los tipos no, esto se pone rojo y deja el archivo correcto
      # como artefacto para bajarlo y confirmarlo.
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Instalar dependencias (para el CLI de Supabase)
        run: pnpm install --frozen-lockfile
      - name: Tipos al día con el esquema
        run: node scripts/verificar-tipos.mjs
        env:
          DATABASE_URL: postgres://postgres:pruebas@localhost:5432/pruebas
      - name: Guardar los tipos generados si difieren
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: database.types.generated
          path: lib/supabase/database.types.generated.ts
          if-no-files-found: ignore
